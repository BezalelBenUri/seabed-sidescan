[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "seabed-sidescan"
version = "0.1.0"
description = "Side-scan sonar raster analysis and unsupervised acoustic facies classification."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "BezalelBenUri", email = "diamondinyang@gmail.com" }
]
dependencies = [
  # Rasterio 1.4.x (Python 3.10) uses the multiplication API deprecated in Affine 3.
  "affine>=2.4,<3",
  "numpy>=1.24",
  "pyshp>=2.3",
  "rasterio>=1.3",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "PyYAML>=6.0"
]
keywords = ["sidescan", "sonar", "seabed", "acoustic-facies", "geospatial", "QGIS"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/BezalelBenUri/seabed-sidescan"
Documentation = "https://github.com/BezalelBenUri/seabed-sidescan/blob/main/README.md"
Repository = "https://github.com/BezalelBenUri/seabed-sidescan"
Issues = "https://github.com/BezalelBenUri/seabed-sidescan/issues"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=6", "pytest>=8", "ruff>=0.9", "virtualenv>=20.29"]

[project.scripts]
seabed-sidescan = "seabed_sidescan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["seabed_sidescan*"]
namespaces = false

[tool.setuptools.package-data]
seabed_sidescan = ["resources/*.yml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
