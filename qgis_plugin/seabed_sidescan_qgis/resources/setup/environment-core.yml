# Solver specification for guided setup, not a platform-specific lock file.
# The installer uses an isolated prefix and strict conda-forge channel priority.
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - setuptools>=77
  - wheel
  - affine=2.4
  - numpy>=1.24
  - pyshp>=2.3
  - rasterio>=1.3,<2
  - scipy>=1.10,<2
  - scikit-image>=0.21,<1
  - scikit-learn>=1.3,<2
  - pyyaml>=6,<7
